name: Promote a beta version

# Flips an app version from the beta channel to stable in catalog.json and
# opens the catalog PR (auto-merged once `validate` passes, like the builder's
# PRs). The entry keeps its image digest: what beta hubs ran is what stable
# hubs get. Release flow: publish X.Y.ZbN from the app repo (a GitHub
# pre-release; the builder adds it as beta, so only beta hubs such as MI see
# it), then run this:
#
#   gh workflow run promote.yml -R blackdiamondlodge/bdh-app-catalog -f app=weather -f version=2.3.0b1

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App id (e.g. weather)"
        required: true
      version:
        description: "Beta version to promote (e.g. 2.3.0b1)"
        required: true

concurrency:
  group: promote-${{ inputs.app }}-${{ inputs.version }}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Optional CATALOG_PR_TOKEN (see build.yml): with it the PR runs
      # `validate` and can auto-merge; without it the branch is pushed and the
      # step summary links it for a human to open the PR.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CATALOG_PR_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q "jsonschema>=4.18"
      - name: Open the promotion PR
        env:
          GH_TOKEN: ${{ secrets.CATALOG_PR_TOKEN || github.token }}
          HAVE_PR_TOKEN: ${{ secrets.CATALOG_PR_TOKEN != '' }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "bdh-builder[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${VERSION#v}"
          python scripts/promote.py "$APP" "$VERSION"
          git show origin/main:catalog.json > "$RUNNER_TEMP/base.json"
          python scripts/validate.py --base "$RUNNER_TEMP/base.json" --pr
          branch="promote/$APP-$VERSION"
          title="Promote $APP $VERSION to stable"
          git checkout -q -B "$branch"
          git commit -qam "$title" -m "Promoted by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -qf origin "$branch"
          body="Moves $APP $VERSION from the beta channel to stable (same image). Requested by @$GITHUB_ACTOR in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          url=$(gh pr list --head "$branch" --json url --jq '.[0].url' || true)
          if [ -z "$url" ]; then
            url=$(gh pr create --head "$branch" --base main --title "$title" --body "$body" 2>&1) || {
              if [ "$HAVE_PR_TOKEN" = true ]; then
                echo "::error::CATALOG_PR_TOKEN could not open the PR for $branch: $url"
                exit 1
              fi
              echo "::warning::could not open the PR ($url); open it from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
              echo "- [$title]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1) (open the PR by hand)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
          fi
          echo "- [$title]($url)" >> "$GITHUB_STEP_SUMMARY"
          gh pr merge "$url" --squash --auto --delete-branch || true
